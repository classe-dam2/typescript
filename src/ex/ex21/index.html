<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Exercici 21</title>
  <script type="module" src="./main.ts" defer></script>
</head>
<body>
  <h1>Personatges</h1>

  <form id="character-form">
    <p>
      Character:
      <select id="characterInput" name="character">
        <option value="barbarian" selected>Barbarian</option>
        <option value="wizard">Wizard</option>
      </select>
    </p>

    <p>
      Name:
      <input type="text" id="nameInput" name="name">
    </p>

    <p>
      Points:
      <input type="number" id="pointsInput" name="points">
    </p>

    <p>
      Weapon / Conjuration:
      <input type="text" id="weaponInput" name="weapon">
    </p>

    <p>
      Damage / Arcane Tradition:
      <input type="text" id="damageInput" name="damage">
    </p>

    <br>

    <button id="afegir" type="submit">Afegir</button>
    <button id="mostrar" type="button">Mostrar</button>
  </form>
    <div id="result"></div>
</body>
</html>
